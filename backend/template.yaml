AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MedClear AI Medical Report Simplifier

Globals:
  Function:
    Runtime: python3.14
    Timeout: 300
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        DDB_TABLE: !Ref SummariesTable
        REGION: !Ref AWS::Region

Parameters:
  AppName:
    Type: String
    Default: medclear
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

Resources:

  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-${Stage}-user-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-${Stage}-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      RefreshTokenValidity: 30

  # Cognito Identity Pool
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${AppName}-${Stage}-identity-pool'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  CognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${Stage}-cognito-auth-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
      Policies:
        - PolicyName: InvokeApi
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:Invoke
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*'

  # S3 Upload Bucket
  UploadedFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${AppName}-${Stage}-uploads-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['GET', 'PUT']
            AllowedOrigins: ['*']
            MaxAge: 3000

  # DynamoDB Summaries Table
  SummariesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub '${AppName}-${Stage}-summaries'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH

  # API Gateway
  ApiGatewayRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AppName}-${Stage}-api'
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,OPTIONS'"
        MaxAge: 86400

  # Lambda - Presign URL
  PreSignFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Stage}-presign'
      CodeUri: src/presign/
      Handler: app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${AppName}-${Stage}-uploads-${AWS::AccountId}/*'
      Environment:
        Variables:
          BUCKET_NAME: !Sub '${AppName}-${Stage}-uploads-${AWS::AccountId}'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /presign
            Method: post
            RestApiId: !Ref ApiGatewayRestApi

  # Lambda - Process Report (S3 trigger)
  ProcessReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Stage}-process-report'
      CodeUri: src/processReport/
      Handler: app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:aws:s3:::${AppName}-${Stage}-uploads-${AWS::AccountId}/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SummariesTable.Arn
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
      Environment:
        Variables:
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      Events:
        PdfUpload:
          Type: S3
          Properties:
            Bucket: !Ref UploadedFilesBucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf
        JpgUpload:
          Type: S3
          Properties:
            Bucket: !Ref UploadedFilesBucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .jpg
        PngUpload:
          Type: S3
          Properties:
            Bucket: !Ref UploadedFilesBucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .png

  # Lambda - Get Summary (polling)
  GetSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Stage}-get-summary'
      CodeUri: src/getsummary/
      Handler: app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SummariesTable.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /summary/{report_id}
            Method: get
            RestApiId: !Ref ApiGatewayRestApi

Outputs:
  ApiEndpoint:
    Description: Base URL for the REST API
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient
  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref CognitoIdentityPool
  UploadBucket:
    Description: S3 bucket for user uploads
    Value: !Ref UploadedFilesBucket
  SummariesTableName:
    Description: DynamoDB table name
    Value: !Ref SummariesTable
